name: Ticket Auto-Escalation

# Escalates overdue level-0 tickets to the System admin once their urgency SLA is breached
# (fn_ticket_auto_escalate, migration 0139). Requires repo secret DATABASE_URL (Supabase
# session-pooler URL, :5432).
#
# THE SCHEDULE IS OFF (2026-10-22, owner's call). It ran `*/15 * * * *` — 96 runs a day, each one a
# fresh runner, an `npm ci` and a connection to production, to ask a question that is usually
# answered "nothing to escalate". Manual runs still work: Actions -> Ticket Auto-Escalation -> Run
# workflow.
#
# WHAT IS OFF WHILE THIS IS: an overdue level-0 ticket is no longer escalated to the System admin on
# its own. The SLA is still recorded and fn_ticket_auto_escalate is unchanged — nothing calls it
# until someone runs this, so breaches accumulate silently and are escalated in a batch whenever it
# next runs. Re-enable by restoring the `schedule:` block below. The cheaper long-term home is the
# API process, which already runs interval timers on Fly (see the reconcile sweeps in server.ts) at
# no cost and with no dependency on GitHub.
on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ticket-escalate
  cancel-in-progress: false

jobs:
  escalate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Auto-escalate overdue tickets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "No DATABASE_URL secret — skipping."; exit 0; fi
          node --import tsx scripts/ops_ticket_escalate.mts
